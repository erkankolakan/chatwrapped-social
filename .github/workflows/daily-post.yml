name: Günlük paylaşım

on:
  schedule:
    - cron: "0 17 * * *" # Her gün 17:00 UTC = 20:00 Türkiye
  workflow_dispatch:
    inputs:
      post:
        description: "Belirli bir gönderi klasörü (örn. 003). Boş = sıradaki"
        required: false
      platforms:
        description: "Virgülle platformlar (instagram,facebook,tiktok,youtube). Boş = hepsi"
        required: false
      dry_run:
        description: "Deneme modu (paylaşmadan sadece göster)"
        type: boolean
        default: false
      check:
        description: "Sadece bağlantı kontrolü (anahtarlar çalışıyor mu)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Paylaş
        run: node scripts/post.mjs
        env:
          FORCE_POST: ${{ inputs.post }}
          FORCE_PLATFORMS: ${{ inputs.platforms }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECK: ${{ inputs.check }}
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Paylaşım durumu güncellendi [skip ci]" && git push)
